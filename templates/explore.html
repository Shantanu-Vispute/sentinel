<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sentinel · Explore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAF9F5; --surface: #F3EFE6; --border: #E7E1D4; --border-strong: #D7CFBD;
  --text: #1F1E1D; --text-muted: #6B6660; --text-subtle: #94908A;
  --accent: #C15F3C; --accent-hover: #A54E2F; --accent-soft: #F3E0D5;
}
html[data-theme="dark"] {
  --bg: #262624; --surface: #2F2E2B; --border: #3A3936; --border-strong: #4A4844;
  --text: #EDE9DE; --text-muted: #B4ADA0; --text-subtle: #857F72;
  --accent: #D97757; --accent-hover: #E88868; --accent-soft: #3D2F28;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Inter", system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 15px; -webkit-font-smoothing: antialiased;
}
.layout { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }
.sidebar {
  background: var(--surface); border-right: 1px solid var(--border);
  padding: 24px 0; position: sticky; top: 0; height: 100vh;
  overflow-y: auto; font-size: 14px;
}
.sidebar-header { padding: 0 22px 18px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.sidebar-header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
.sidebar-header .subtitle { font-size: 12px; color: var(--text-subtle); font-weight: 400; margin-top: 2px; }
.mode-toggle {
  display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 3px; margin: 14px 10px 0;
}
.mode-toggle a {
  flex: 1; text-align: center; padding: 6px 10px;
  font-family: "Inter", system-ui, sans-serif; font-size: 12.5px; font-weight: 500;
  color: var(--text-muted); text-decoration: none; border-radius: 6px;
  transition: background 100ms, color 100ms;
}
.mode-toggle a:hover { color: var(--text); }
.mode-toggle a.active { background: var(--accent); color: white; font-weight: 600; }
.section-label {
  font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--text-subtle); padding: 14px 22px 6px;
}
.side-nav { list-style: none; padding: 0 10px; margin: 0; }
.side-nav li a {
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 6px 12px; border-radius: 6px;
  color: var(--text-muted); text-decoration: none; font-weight: 500;
  font-size: 13.5px;
}
.side-nav li a:hover { color: var(--text); background: var(--border); }
.side-nav li a.active { color: var(--accent); background: var(--accent-soft); }
.main { padding: 44px 48px 120px; }
@media (max-width: 860px) { .main { padding: 24px 20px 80px; } }
.page-header h1 {
  font-family: "Inter", sans-serif; font-weight: 700; font-size: 30px;
  letter-spacing: -0.03em; margin: 0 0 4px;
}
.page-header .subtitle { color: var(--text-subtle); font-size: 14px; margin-bottom: 22px; }
.toolbar {
  display: grid; grid-template-columns: repeat(6, minmax(120px, 1fr)) auto;
  gap: 10px; align-items: center; margin-bottom: 18px;
}
@media (max-width: 1100px) { .toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.toolbar select, .toolbar input {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 9px 12px; font: inherit; font-size: 13.5px; color: var(--text);
  font-family: "Inter", sans-serif; outline: none;
}
.toolbar select:focus, .toolbar input:focus { border-color: var(--accent); }
.toolbar button {
  background: var(--accent); color: white; border: 1px solid var(--accent); border-radius: 8px;
  padding: 9px 16px; cursor: pointer; font: inherit; font-size: 13.5px; font-weight: 600;
  font-family: "Inter", sans-serif;
}
.toolbar button:hover { background: var(--accent-hover); }
.status { color: var(--text-subtle); font-size: 12.5px; margin-bottom: 14px; }
.status.error { color: #d95150; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 18px; }
.explore-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  color: inherit; min-height: 360px; overflow: hidden; display: flex; flex-direction: column;
  position: relative;
}
.explore-card:hover { border-color: var(--border-strong); }
.explore-card.read { opacity: 0.58; }
.card-skip {
  position: absolute; top: 10px; right: 10px; z-index: 2;
  width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  color: var(--text-muted); cursor: pointer; line-height: 1; font-size: 17px;
  display: flex; align-items: center; justify-content: center;
}
.card-skip:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.thumb { width: 100%; height: 156px; object-fit: cover; display: block; background: var(--border); }
.thumb-empty {
  height: 156px; display: flex; align-items: center; justify-content: center;
  background: var(--border); color: var(--text-subtle); font-family: "Source Serif 4", Georgia, serif;
  font-size: 48px; font-weight: 600;
}
.card-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; color: var(--text-subtle); font-size: 11.5px; }
.pill {
  display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 8px;
  background: var(--border); color: var(--text-muted); font-weight: 600;
}
.title {
  color: var(--text); text-decoration: none; font-weight: 700; font-size: 17px;
  line-height: 1.28; letter-spacing: -0.01em;
}
.title:hover { color: var(--accent); }
.summary {
  color: var(--text-muted); font-family: "Source Serif 4", Georgia, serif; line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
}
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.tag {
  color: var(--text-muted); background: var(--bg); border: 1px solid var(--border);
  border-radius: 999px; padding: 3px 8px; font-size: 11.5px;
}
.actions { display: flex; gap: 8px; align-items: center; margin-top: 2px; }
.actions a {
  color: var(--accent); text-decoration: none; font-size: 12.5px; font-weight: 600;
}
.actions a:hover { text-decoration: underline; }
.local-signals { min-height: 20px; }
.local-signals .pill { font-size: 10.5px; }
.load-sentinel {
  height: 56px; display: flex; align-items: center; justify-content: center;
  color: var(--text-subtle); font-size: 12.5px; margin-top: 18px;
}
.theme-toggle {
  position: fixed; top: 16px; right: 20px; z-index: 10;
  background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
  width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 15px;
}
.theme-toggle:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
html[data-theme="dark"] .sun { display: none; }
html:not([data-theme="dark"]) .moon { display: none; }
</style>
<script>
(function () {
  var saved = localStorage.getItem("theme");
  if (saved === "dark" || (saved === null && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();
</script>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
  <span class="sun">☀</span><span class="moon">☾</span>
</button>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Sentinel</h1>
      <div class="subtitle">BestBlogs explore</div>
    </div>
    <div class="section-label">Views</div>
    <div class="mode-toggle">
      <a href="/home">Home</a>
      <a href="/digest">Following</a>
    </div>
    <ul class="side-nav">
      <li><a href="/explore" class="active">Explore</a></li>
    </ul>
  </aside>
  <main class="main">
    <header class="page-header">
      <h1>Explore</h1>
      <div class="subtitle" id="subtitle">BestBlogs resources</div>
    </header>
    <form class="toolbar" id="filters">
      <select name="type" aria-label="Type">
        <option value="ARTICLE">Articles</option>
        <option value="VIDEO">Videos</option>
        <option value="PODCAST">Podcasts</option>
        <option value="TWITTER">Tweets</option>
        <option value="ALL">All</option>
      </select>
      <select name="sort" aria-label="Sort">
        <option value="time_desc">Newest</option>
        <option value="score_desc">Top score</option>
        <option value="read_desc">Most read</option>
        <option value="default">Default</option>
      </select>
      <select name="timeFilter" aria-label="Time">
        <option value="1d">1 day</option>
        <option value="3d">3 days</option>
        <option value="1w">1 week</option>
        <option value="1m">1 month</option>
        <option value="3m">3 months</option>
        <option value="1y">1 year</option>
        <option value="all">All time</option>
      </select>
      <select name="category" aria-label="Category">
        <option value="all">All categories</option>
        <option value="ai">AI</option>
        <option value="programming">Programming</option>
        <option value="business">Business</option>
        <option value="product">Product</option>
        <option value="growth">Growth</option>
        <option value="finance">Finance</option>
        <option value="lifestyle">Lifestyle</option>
        <option value="news">News</option>
      </select>
      <select name="score" aria-label="Score">
        <option value="all">Any score</option>
        <option value="high">91-100</option>
        <option value="medium">86-90</option>
        <option value="low">75-85</option>
      </select>
      <select name="language" aria-label="Language">
        <option value="all">All languages</option>
        <option value="en_US">English</option>
        <option value="zh_CN">Chinese</option>
      </select>
    </form>
    <div class="status" id="status">Loading…</div>
    <div class="grid" id="grid"></div>
    <div class="load-sentinel" id="loadSentinel">Scroll for more</div>
  </main>
</div>
<script>
var initial = {
  type: "{{ type }}",
  sort: "{{ sort }}",
  category: "{{ category }}",
  timeFilter: "{{ time_filter }}",
  language: "{{ language }}",
  page: {{ page }},
  pageSize: 10
};
var state = Object.assign({}, initial);
var lastPageCount = 1;
var filters = document.getElementById("filters");
var grid = document.getElementById("grid");
var statusEl = document.getElementById("status");
var subtitle = document.getElementById("subtitle");
var loadSentinel = document.getElementById("loadSentinel");
var isLoading = false;
var loadedCount = 0;
var totalCount = 0;
var observer = null;
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, function (c) {
    return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]);
  });
}
function setForm() {
  Array.from(filters.elements).forEach(function (el) {
    if (el.name && state[el.name] !== undefined) el.value = state[el.name];
  });
}
function scoreParams(value) {
  if (value === "high") return { lowerTotalScore: "91", upperTotalScore: "100" };
  if (value === "medium") return { lowerTotalScore: "86", upperTotalScore: "90" };
  if (value === "low") return { lowerTotalScore: "75", upperTotalScore: "85" };
  return {};
}
function apiParams() {
  var params = new URLSearchParams();
  params.set("page", state.page);
  params.set("pageSize", state.pageSize || 10);
  params.set("type", state.type);
  params.set("sort", state.sort);
  params.set("timeFilter", state.timeFilter);
  params.set("language", state.language);
  if (state.category && state.category !== "all") params.set("category", state.category);
  var scores = scoreParams(state.score || "all");
  Object.keys(scores).forEach(function (key) { params.set(key, scores[key]); });
  return params;
}
function syncUrl() {
  var params = new URLSearchParams();
  params.set("type", String(state.type || "ARTICLE").toLowerCase());
  params.set("sort", state.sort || "time_desc");
  params.set("timeFilter", state.timeFilter || "1w");
  if (state.category && state.category !== "all") params.set("category", state.category);
  if (state.language && state.language !== "all") params.set("language", state.language);
  if (state.score && state.score !== "all") params.set("score", state.score);
  history.replaceState({}, "", "/explore?" + params.toString());
}
function cardHtml(item) {
    var itemId = item.localItemId || item.id || item.readUrl || item.url || "";
    var tags = (item.tags || []).slice(0, 4).map(function (tag) {
      return '<span class="tag">' + escapeHtml(tag) + '</span>';
    }).join("");
    var signals = (item.localSignals || []).slice(0, 3).map(function (signal) {
      return '<span class="pill">' + escapeHtml(signal.replace(/_/g, " ")) + '</span>';
    }).join("");
    if (item.localDuplicateCount) {
      signals += '<span class="pill">+' + escapeHtml(String(item.localDuplicateCount)) + ' similar</span>';
    }
    if (item.localScore !== undefined && item.localScore !== null) {
      signals = '<span>local ' + escapeHtml(String(item.localScore)) + '</span>' + signals;
    }
    var image = item.cover
      ? '<img class="thumb" src="' + escapeHtml(item.cover) + '" alt="" loading="lazy" referrerpolicy="no-referrer">'
      : '<div class="thumb-empty">' + escapeHtml((item.title || "?").trim().charAt(0).toUpperCase()) + '</div>';
    return '<article class="explore-card' + (item.isRead ? ' read' : '') + '" data-item-id="' + escapeHtml(String(itemId)) + '">' +
      '<button class="card-skip" type="button" data-skip aria-label="Skip" title="Skip">×</button>' +
      image +
      '<div class="card-body">' +
        '<div class="meta">' +
          '<span class="pill">' + escapeHtml(item.resourceTypeDesc || item.resourceType || "") + '</span>' +
          '<span class="pill">' + escapeHtml(item.aiSubCategoryDesc || item.categoryDesc || item.category || "") + '</span>' +
          '<span>score ' + escapeHtml(String(item.score || 0)) + '</span>' +
          '<span>' + escapeHtml(item.publishDateStr || item.publishDateTimeStr || "") + '</span>' +
        '</div>' +
        '<a class="title" href="' + escapeHtml(item.url || item.readUrl || "#") + '" target="_blank" rel="noopener">' + escapeHtml(item.title || item.originalTitle || "(untitled)") + '</a>' +
        '<div class="summary">' + escapeHtml(item.oneSentenceSummary || item.summary || "") + '</div>' +
        '<div class="meta"><span>' + escapeHtml(item.sourceName || "") + '</span><span>' + escapeHtml(item.domain || "") + '</span></div>' +
        (signals ? '<div class="meta local-signals">' + signals + '</div>' : '') +
        (tags ? '<div class="tags">' + tags + '</div>' : '') +
        '<div class="actions">' +
          (item.url ? '<a href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener" data-mark-read>source</a>' : '') +
          (item.readUrl ? '<a href="' + escapeHtml(item.readUrl) + '" target="_blank" rel="noopener" data-mark-read>bestblogs</a>' : '') +
        '</div>' +
      '</div>' +
    '</article>';
}
function render(items, append) {
  var html = items.map(cardHtml).join("");
  if (append) grid.insertAdjacentHTML("beforeend", html); else grid.innerHTML = html;
}
function markExternalItem(id, field, value) {
  if (!id) return Promise.resolve();
  var endpoint = field === "skipped" ? "/api/digest/skip" : "/api/digest/read";
  return fetch(endpoint, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: id, value: value ? 1 : 0 }),
    keepalive: true
  });
}
function updateLoadSentinel() {
  if (!loadSentinel) return;
  if (isLoading) {
    loadSentinel.textContent = "Loading more…";
  } else if (state.page >= lastPageCount) {
    loadSentinel.textContent = loadedCount ? "End of results" : "";
  } else {
    loadSentinel.textContent = "Scroll for more";
  }
}
function load(reset) {
  if (isLoading) return;
  isLoading = true;
  setForm();
  syncUrl();
  statusEl.className = "status";
  if (reset) {
    state.page = 1;
    loadedCount = 0;
    grid.innerHTML = "";
    statusEl.textContent = "Loading…";
  }
  updateLoadSentinel();
  fetch("/api/explore/resources?" + apiParams().toString())
    .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
    .then(function (result) {
      if (!result.ok || result.data.success === false) throw new Error(result.data.message || "Explore request failed");
      var data = result.data.data || {};
      var items = data.dataList || [];
      lastPageCount = data.pageCount || 1;
      totalCount = data.totalCount || 0;
      loadedCount += items.length;
      subtitle.textContent = totalCount + " resources";
      statusEl.textContent = loadedCount ? loadedCount + " loaded" : "No resources found";
      render(items, !reset);
    })
    .catch(function (err) {
      statusEl.className = "status error";
      statusEl.textContent = err.message || "Explore request failed";
      if (reset) grid.innerHTML = "";
    })
    .finally(function () {
      isLoading = false;
      updateLoadSentinel();
    });
}
function applyFilters() {
  var form = new FormData(filters);
  state.type = form.get("type");
  state.sort = form.get("sort");
  state.timeFilter = form.get("timeFilter");
  state.category = form.get("category");
  state.score = form.get("score");
  state.language = form.get("language");
  load(true);
}
filters.addEventListener("submit", function (e) {
  e.preventDefault();
  applyFilters();
});
filters.addEventListener("change", function (e) {
  if (e.target && e.target.tagName === "SELECT") applyFilters();
});
grid.addEventListener("click", function (event) {
  var skipButton = event.target.closest("[data-skip]");
  if (skipButton) {
    event.preventDefault();
    var skipCard = skipButton.closest(".explore-card");
    var skipId = skipCard ? skipCard.getAttribute("data-item-id") : "";
    if (!skipId) return;
    markExternalItem(skipId, "skipped", true).then(function () {
      skipCard.remove();
      loadedCount = Math.max(loadedCount - 1, 0);
      statusEl.textContent = loadedCount ? loadedCount + " loaded" : "No resources found";
    });
    return;
  }
  var link = event.target.closest("a");
  if (!link || !link.closest(".explore-card")) return;
  var card = link.closest(".explore-card");
  var itemId = card.getAttribute("data-item-id");
  if (!itemId) return;
  card.classList.add("read");
  markExternalItem(itemId, "is_read", true);
});
document.getElementById("themeToggle").addEventListener("click", function () {
  var html = document.documentElement;
  var next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
  if (next === "dark") html.setAttribute("data-theme", "dark"); else html.removeAttribute("data-theme");
  localStorage.setItem("theme", next);
});
state.score = new URLSearchParams(window.location.search).get("score") || "all";
setForm();
if (loadSentinel) {
  observer = new IntersectionObserver(function (entries) {
    if (entries.some(function (entry) { return entry.isIntersecting; }) && !isLoading && state.page < lastPageCount) {
      state.page += 1;
      load(false);
    }
  }, { rootMargin: "900px 0px" });
  observer.observe(loadSentinel);
}
load(true);
</script>
</body>
</html>
